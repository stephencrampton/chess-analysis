[project]
name = "chess-analysis"
version = "0.1.0"
description = "Download recent Chess.com games as PGN"
requires-python = ">=3.10"
dependencies = [
    "python-chess>=1.999",
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["chess_analysis"]

[tool.coverage.report]
fail_under = 80
exclude_also = [
    "def main\\(",
    "if __name__ == .__main__.:",
]